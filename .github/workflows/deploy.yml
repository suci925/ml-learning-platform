name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build -- --base "/${{ github.event.repository.name }}/"

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist

      - name: Check Pages status
        run: |
          echo "=== Pages status ==="
          gh api repos/${{ github.repository }}/pages 2>&1 || echo "Pages not configured yet"

      - name: Enable GitHub Pages
        run: |
          echo "=== Enabling Pages ==="
          gh api repos/${{ github.repository }}/pages -X PUT \
            -F "source[branch]=gh-pages" \
            -F "source[path]=/" 2>&1

      - name: Show deployed URL
        run: |
          echo "Site URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
